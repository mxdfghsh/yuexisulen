<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050810">
<title>汐岸速写 · 月汐 SULEN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✏️</text></svg>">
<link rel="stylesheet" href="../../assets/base.css">
</head>
<body class="gamepage">
<div class="hud">
  <a class="back" href="../../index.html">← 退出</a>
  <div class="score"><span id="left">0</span> 条线</div>
</div>
<canvas id="cv"></canvas>

<div class="overlay" id="start">
  <div class="overlay-inner">
    <h2>汐岸速写</h2>
    <p>一笔画完所有线，每条线只能走一次。<br>从任意圆点按住，沿着连线拖到下一个点。</p>
    <button class="btn" id="go" type="button">开始</button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="overlay-inner">
    <h2>画完了</h2>
    <p>第 <b><span id="lv">1</span></b> 关完成，共用了 <b><span id="steps">0</span></b> 步。</p>
    <button class="btn" id="next" type="button">下一关</button>
    <p style="margin-top:14px"><a href="../../index.html" style="color:var(--muted);font-size:12.5px">回月汐</a></p>
  </div>
</div>

<script src="../../assets/engine.js"></script>
<script src="game.js"></script>
</body>
</html>
