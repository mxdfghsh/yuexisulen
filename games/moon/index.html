<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#050810">
<title>月轮 · 月汐 SULEN</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌙</text></svg>">
<link rel="stylesheet" href="../../assets/base.css">
</head>
<body class="gamepage">
<div class="hud">
  <a class="back" href="../../index.html">← 退出</a>
  <div class="score">第 <span id="lv">1</span> 关</div>
</div>
<canvas id="cv"></canvas>

<div class="overlay" id="start">
  <div class="overlay-inner">
    <h2>月轮</h2>
    <p>每个圆环有一个缺口。点一下圆环，它和相邻的环会朝相反方向转一格。<br>把所有缺口对到下方那条月光上。</p>
    <button class="btn" id="go" type="button">开始</button>
  </div>
</div>

<div class="overlay" id="win" hidden>
  <div class="overlay-inner">
    <h2>对上了</h2>
    <p>第 <b><span id="wlv">1</span></b> 关完成。</p>
    <button class="btn" id="next" type="button">下一关</button>
    <p style="margin-top:14px"><a href="../../index.html" style="color:var(--muted);font-size:12.5px">回月汐</a></p>
  </div>
</div>

<script src="../../assets/engine.js"></script>
<script src="game.js"></script>
</body>
</html>
